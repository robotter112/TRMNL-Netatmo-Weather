<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f7f8fa"/>
      <stop offset="100%" stop-color="#dfe3e8"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7c838c"/>
      <stop offset="12%"  stop-color="#a9b0b8"/>
      <stop offset="30%"  stop-color="#eef1f4"/>
      <stop offset="42%"  stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#e4e8ec"/>
      <stop offset="74%"  stop-color="#b0b7bf"/>
      <stop offset="90%"  stop-color="#868d95"/>
      <stop offset="100%" stop-color="#646b73"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9aa1a9"/>
      <stop offset="45%"  stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#7f868e"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- kleine Roehre: Aussenmodul -->
  <g>
    <rect x="150" y="118" width="34" height="96" rx="17" fill="url(#alu)"/>
    <rect x="150" y="118" width="34" height="96" rx="17" fill="none" stroke="#5d646c" stroke-opacity=".35"/>
    <ellipse cx="167" cy="123" rx="13.5" ry="4.5" fill="url(#cap)"/>
    <rect x="162" y="126" width="3" height="78" rx="1.5" fill="#ffffff" opacity=".75"/>
  </g>

  <!-- grosse Roehre: Innenmodul -->
  <g>
    <rect x="72" y="52" width="58" height="162" rx="29" fill="url(#alu)"/>
    <rect x="72" y="52" width="58" height="162" rx="29" fill="none" stroke="#5d646c" stroke-opacity=".4"/>
    <ellipse cx="101" cy="60" rx="23" ry="7" fill="url(#cap)"/>
    <ellipse cx="101" cy="60" rx="23" ry="7" fill="none" stroke="#5d646c" stroke-opacity=".28"/>
    <rect x="94" y="66" width="5" height="134" rx="2.5" fill="#ffffff" opacity=".8"/>
    <rect x="72" y="52" width="58" height="162" rx="29" fill="url(#fade)"/>
  </g>

  <!-- Bodenschatten -->
  <ellipse cx="101" cy="220" rx="34" ry="6" fill="#000" opacity=".10"/>
  <ellipse cx="167" cy="219" rx="20" ry="4" fill="#000" opacity=".09"/>
</svg>
