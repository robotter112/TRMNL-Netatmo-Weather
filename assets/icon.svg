<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDBA5E"/><stop offset="55%" stop-color="#F59029"/><stop offset="100%" stop-color="#E2650C"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8f959c"/>
      <stop offset="8%"   stop-color="#b9bfc6"/>
      <stop offset="22%"  stop-color="#e8ebee"/>
      <stop offset="38%"  stop-color="#fdfdfe"/>
      <stop offset="52%"  stop-color="#eceff2"/>
      <stop offset="70%"  stop-color="#ccd1d7"/>
      <stop offset="86%"  stop-color="#a2a9b1"/>
      <stop offset="100%" stop-color="#848b93"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9aa1a9"/>
      <stop offset="35%"  stop-color="#d9dde1"/>
      <stop offset="100%" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2e5e9"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Standfuss -->
  <ellipse cx="128" cy="214" rx="55" ry="12" fill="#7A3403" opacity=".22"/>
  <rect x="76" y="196" width="104" height="20" rx="10" fill="url(#base)"/>
  <ellipse cx="128" cy="196" rx="52" ry="10" fill="#ffffff"/>

  <!-- Koerper -->
  <rect x="87" y="26" width="82" height="176" rx="24" fill="url(#alu)"/>
  <rect x="87" y="26" width="82" height="176" rx="24" fill="none" stroke="#767d85" stroke-opacity=".45" stroke-width="1.5"/>

  <!-- Schlitz -->
  <rect x="119" y="60" width="18" height="110" rx="9" fill="url(#slot)"/>
  <rect x="119" y="60" width="18" height="110" rx="9" fill="none" stroke="#7e858d" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="121.5" y="63" width="5" height="104" rx="2.5" fill="#6f767e" opacity=".28"/>
</svg>
